services:
  - type: web
    name: prem-ium-card
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      # iOS hands a response to Contacts based on this type; without it the
      # .vcf is served as octet-stream and lands in Files instead.
      - path: /prem-tamanam.vcf
        name: Content-Type
        value: text/vcard; charset=utf-8
      - path: /prem-tamanam.vcf
        name: Content-Disposition
        value: attachment; filename="prem-tamanam.vcf"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
